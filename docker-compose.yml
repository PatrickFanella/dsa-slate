services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dsa_slate}
      POSTGRES_USER: ${POSTGRES_USER:-dsa_slate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dsa_slate} -d $${POSTGRES_DB:-dsa_slate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dsa_slate}
      POSTGRES_USER: ${POSTGRES_USER:-dsa_slate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      GOOGLE_CIVIC_API_KEY: ${GOOGLE_CIVIC_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:5173/api/auth/google/callback}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  postgres-data:
